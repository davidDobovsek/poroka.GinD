<!DOCTYPE html>
<html lang="sl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greta in David</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        .font-serif-custom {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Stanje ob pomiku navzdol */
        body.scrolled {
            background-color: #7F94A7 !important;
            color: #ffffff !important;
        }

        body.scrolled .text-transition {
            color: #ffffff !important;
        }

        body.scrolled .video-container {
            border-color: rgba(255, 255, 255, 0.2);
        }

        body.scrolled .btn-control {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        body.scrolled .btn-control:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .text-transition {
            transition: color 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center selection:bg-slate-200 selection:text-slate-900">

    <!-- Zgornji del: Naslov -->
    <header class="w-full pt-12 md:pt-16 pb-6 text-center z-10 px-4">
        <h1 class="font-serif-custom text-2xl sm:text-3xl md:text-4xl tracking-[0.2em] font-light uppercase text-transition text-gray-800">
            Greta in David
        </h1>
    </header>

    <!-- Osrednji del: Video predvajalnik -->
    <main class="w-full max-w-4xl px-4 sm:px-6 my-auto flex flex-col items-center">
        <div class="video-container relative w-full aspect-[16/9] max-h-[65vh] rounded-sm overflow-hidden shadow-sm border border-gray-100 transition-colors duration-500 bg-black/5">
            
            <video 
                id="weddingVideo"
                class="w-full h-full object-cover"
                autoplay 
                loop 
                muted 
                playsinline
            >
                <source src="save_the_date.mp4" type="video/mp4">
                Vaš brskalnik ne podpira predvajanja videa.
            </video>

            <!-- Gumb za zvok -->
            <div class="absolute bottom-4 right-4 flex items-center gap-2 z-20">
                <button 
                    id="audioBtn" 
                    aria-label="Vklopi zvok"
                    class="btn-control p-2.5 rounded-full bg-black/30 hover:bg-black/50 text-white backdrop-blur-md transition-all duration-300 focus:outline-none"
                >
                    <!-- Ikona: Brez zvoka -->
                    <svg id="muteIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                    <!-- Ikona: Z zvokom -->
                    <svg id="unmuteIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Spodnji del: Datum, Obvestilo in Kontakt -->
    <footer id="footerTrigger" class="w-full pt-20 pb-12 text-center px-4 flex flex-col items-center justify-end min-h-[35vh]">
        <div class="max-w-md mx-auto space-y-4">
            <p class="font-serif-custom text-xl sm:text-2xl tracking-[0.2em] text-transition text-gray-700 font-light">
                17. 7. 2027
            </p>
            
            <p class="text-xs sm:text-sm tracking-[0.15em] font-light uppercase text-transition text-gray-500">
                Ostale informacije bodo sčasoma objavljene
            </p>

            <p class="text-[10px] tracking-[0.1em] font-light text-transition text-gray-400 opacity-80 pt-8">
                kontakt David: 070 513 645 in Greta: 041 768 438
            </p>
        </div>
    </footer>

    <script>
        // Upravljanje videa
        const video = document.getElementById('weddingVideo');
        const audioBtn = document.getElementById('audioBtn');
        const muteIcon = document.getElementById('muteIcon');
        const unmuteIcon = document.getElementById('unmuteIcon');

        audioBtn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                muteIcon.classList.add('hidden');
                unmuteIcon.classList.remove('hidden');
            } else {
                video.muted = true;
                muteIcon.classList.remove('hidden');
                unmuteIcon.classList.add('hidden');
            }
        });

        // Prehod barve ozadja ob pomiku navzdol
        const footerTrigger = document.getElementById('footerTrigger');
        const observerOptions = {
            root: null,
            threshold: 0.2
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.body.classList.add('scrolled');
                } else {
                    document.body.classList.remove('scrolled');
                }
            });
        }, observerOptions);

        observer.observe(footerTrigger);
    </script>
</body>
</html>
