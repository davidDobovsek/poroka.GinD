<!DOCTYPE html>
<html lang="sl" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greta in David</title>

    <!-- Google Fonts: Cormorant Garamond & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth background and text color transitions with 0.5s speed */
        body {
            background-color: #FFFFFF;
            color: #1A1A1A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
        }

        /* Active class when bottom section is in view - Slate blue shade */
        body.theme-mode {
            background-color: #7F94A7;
            color: #FFFFFF;
        }

        /* Transition for section text elements */
        .color-transition {
            transition: color 0.5s ease-in-out;
        }

        /* Subtle scroll animation */
        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Subtle control buttons overlay */
        .video-control-btn {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body id="pageBody" class="antialiased flex flex-col min-h-screen">

    <main class="flex-grow">
        <!-- Hero Sekcija / Naslov in Video -->
        <section class="min-h-screen px-6 py-12 md:py-20 flex flex-col justify-center items-center max-w-5xl mx-auto">
            
            <!-- Glavni Naslov: Greta in David -->
            <header class="text-center mb-8 md:mb-12 fade-in-section is-visible">
                <h1 class="color-transition font-serif text-xl sm:text-2xl md:text-3xl font-light tracking-[0.2em] uppercase leading-relaxed text-neutral-900 opacity-90">
                    Greta in David
                </h1>
            </header>

            <!-- Osrednji Video Predvajalnik -->
            <div class="w-full max-w-3xl mx-auto fade-in-section is-visible">
                <div class="relative w-full aspect-video bg-neutral-100 rounded-lg overflow-hidden shadow-sm border border-neutral-100">
                    
                    <video id="weddingVideo" class="w-full h-full object-cover" autoplay loop muted playsinline>
                        <source src="https://assets.mixkit.co/videos/preview/mixkit-top-view-of-a-luxurious-clock-41556-large.mp4" type="video/mp4">
                        Vaš brskalnik ne podpira videa.
                    </video>

                    <!-- Diskreten gumb za preklop zvoka -->
                    <button id="muteBtn" onclick="toggleMute()" class="video-control-btn absolute bottom-4 right-4 bg-white/70 hover:bg-white/90 text-neutral-700 p-2.5 rounded-full transition duration-300 shadow-sm border border-black/5" title="Preklop zvoka">
                        <svg id="iconMuted" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                        <svg id="iconUnmuted" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Indikator za skrolanje -->
            <div class="mt-16 md:mt-24 fade-in-section opacity-30">
                <div class="w-[1px] h-10 bg-neutral-400 mx-auto"></div>
            </div>
        </section>

        <!-- Spodnja sekcija (Barvno ozadje ob prehodu) -->
        <section id="infoSection" class="min-h-[80vh] px-6 py-28 flex flex-col justify-between items-center text-center">
            <div></div> <!-- Prazen prostor za vertikalno poravnavo -->
            
            <div class="max-w-2xl mx-auto fade-in-section my-auto space-y-6">
                <!-- Datum poroke -->
                <p id="dateText" class="color-transition font-serif text-3xl sm:text-4xl md:text-5xl font-light tracking-widest text-neutral-900">
                    17. 7. 2027
                </p>

                <!-- Informacijski napis -->
                <p id="infoText" class="color-transition font-serif text-xl sm:text-2xl md:text-3xl font-light tracking-wide leading-relaxed text-neutral-800">
                    Ostale informacije bodo sčasoma objavljene.
                </p>
            </div>

            <!-- Zelo majhen in diskreten kontakt na dnu -->
            <footer class="fade-in-section pt-16 pb-4">
                <p id="contactText" class="color-transition font-sans text-[10px] tracking-widest uppercase opacity-75 text-neutral-500">
                    kontakt David: 070 513 645 in Greta: 041 768 438
                </p>
            </footer>
        </section>
    </main>

    <script>
        // Funkcija za preklop zvoka videa
        function toggleMute() {
            const video = document.getElementById('weddingVideo');
            const iconMuted = document.getElementById('iconMuted');
            const iconUnmuted = document.getElementById('iconUnmuted');

            if (video.muted) {
                video.muted = false;
                iconMuted.classList.add('hidden');
                iconUnmuted.classList.remove('hidden');
            } else {
                video.muted = true;
                iconMuted.classList.remove('hidden');
                iconUnmuted.classList.add('hidden');
            }
        }

        // Observer za prehod barve ozadja ob pomiku do spodnjega napisa
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.getElementById('pageBody');
            const infoSection = document.getElementById('infoSection');
            const dateText = document.getElementById('dateText');
            const infoText = document.getElementById('infoText');
            const contactText = document.getElementById('contactText');

            // Intersection Observer za spremembo ozadja
            const bgObserverOptions = {
                root: null,
                threshold: 0.35
            };

            const bgObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        body.classList.add('theme-mode');
                        dateText.classList.remove('text-neutral-900');
                        dateText.classList.add('text-white');
                        infoText.classList.remove('text-neutral-800');
                        infoText.classList.add('text-white');
                        contactText.classList.remove('text-neutral-500');
                        contactText.classList.add('text-white');
                    } else {
                        body.classList.remove('theme-mode');
                        dateText.classList.remove('text-white');
                        dateText.classList.add('text-neutral-900');
                        infoText.classList.remove('text-white');
                        infoText.classList.add('text-neutral-800');
                        contactText.classList.remove('text-white');
                        contactText.classList.add('text-neutral-500');
                    }
                });
            }, bgObserverOptions);

            bgObserver.observe(infoSection);

            // Observer za nežen fade-in elementov ob pomiku
            const fadeObserverOptions = {
                root: null,
                threshold: 0.1
            };

            const fadeObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, fadeObserverOptions);

            document.querySelectorAll('.fade-in-section').forEach(section => {
                fadeObserver.observe(section);
            });
        });
    </script>
</body>
</html>
